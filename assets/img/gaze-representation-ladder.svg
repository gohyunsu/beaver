<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">시선 표현의 정보 보존 사다리</title>
  <desc id="desc">Raw samples에서 fixation events, heatmap, semantic alignment로 변환할 때 보존되고 사라지는 정보를 보여준다.</desc>
  <rect width="1200" height="560" rx="28" fill="#fffdf7"/>
  <text x="54" y="58" fill="#17201d" font-family="Arial, sans-serif" font-size="29" font-weight="700">Gaze is not one representation</text>
  <text x="54" y="88" fill="#65706a" font-family="Arial, sans-serif" font-size="16">Each transformation keeps some evidence and discards another.</text>
  <path d="M112 286H1088" stroke="#d6d0c4" stroke-width="4"/><path d="M1088 286l-16-10v20z" fill="#d6d0c4"/>
  <g transform="translate(48 132)"><rect width="250" height="310" rx="22" fill="#f4f0e7" stroke="#d8d0c1"/><text x="24" y="39" fill="#143d35" font-family="Arial, sans-serif" font-size="17" font-weight="700">R0 · RAW SAMPLES</text><polyline points="28,138 48,119 66,128 85,86 104,98 122,70 143,89 163,56 185,78 209,48" fill="none" stroke="#f27c4d" stroke-width="3"/><g fill="#143d35"><circle cx="28" cy="138" r="4"/><circle cx="48" cy="119" r="4"/><circle cx="66" cy="128" r="4"/><circle cx="85" cy="86" r="4"/><circle cx="104" cy="98" r="4"/><circle cx="122" cy="70" r="4"/><circle cx="143" cy="89" r="4"/><circle cx="163" cy="56" r="4"/><circle cx="185" cy="78" r="4"/><circle cx="209" cy="48" r="4"/></g><text x="24" y="210" fill="#17201d" font-family="Arial, sans-serif" font-size="15" font-weight="700">Keeps</text><text x="24" y="235" fill="#65706a" font-family="Arial, sans-serif" font-size="14">velocity · micro-motion · noise</text><text x="24" y="268" fill="#9a4726" font-family="Arial, sans-serif" font-size="14">No event semantics yet</text></g>
  <g transform="translate(335 132)"><rect width="250" height="310" rx="22" fill="#eef4ef" stroke="#c9d9d2"/><text x="24" y="39" fill="#143d35" font-family="Arial, sans-serif" font-size="17" font-weight="700">R1 · FIXATION EVENTS</text><path d="M48 130L116 82L192 127" fill="none" stroke="#65706a" stroke-width="3" stroke-dasharray="6 5"/><circle cx="48" cy="130" r="18" fill="#83b9dc" opacity=".8"/><circle cx="116" cy="82" r="31" fill="#d7f06f" opacity=".9"/><circle cx="192" cy="127" r="23" fill="#f27c4d" opacity=".8"/><text x="24" y="210" fill="#17201d" font-family="Arial, sans-serif" font-size="15" font-weight="700">Keeps</text><text x="24" y="235" fill="#65706a" font-family="Arial, sans-serif" font-size="14">position · duration · order</text><text x="24" y="268" fill="#9a4726" font-family="Arial, sans-serif" font-size="14">Parser assumptions enter</text></g>
  <g transform="translate(622 132)"><rect width="250" height="310" rx="22" fill="#f5f5ec" stroke="#d9ddc3"/><text x="24" y="39" fill="#143d35" font-family="Arial, sans-serif" font-size="17" font-weight="700">R2 · HEATMAP</text><defs><radialGradient id="h1"><stop offset="0" stop-color="#f27c4d" stop-opacity=".9"/><stop offset="1" stop-color="#f27c4d" stop-opacity="0"/></radialGradient><radialGradient id="h2"><stop offset="0" stop-color="#d7f06f" stop-opacity=".9"/><stop offset="1" stop-color="#d7f06f" stop-opacity="0"/></radialGradient></defs><rect x="25" y="55" width="200" height="112" rx="12" fill="#dfe6e2"/><circle cx="92" cy="112" r="58" fill="url(#h1)"/><circle cx="160" cy="92" r="53" fill="url(#h2)"/><text x="24" y="210" fill="#17201d" font-family="Arial, sans-serif" font-size="15" font-weight="700">Keeps</text><text x="24" y="235" fill="#65706a" font-family="Arial, sans-serif" font-size="14">robust spatial density</text><text x="24" y="268" fill="#9a4726" font-family="Arial, sans-serif" font-size="14">Loses order &amp; event identity</text></g>
  <g transform="translate(909 132)"><rect width="250" height="310" rx="22" fill="#fff7f1" stroke="#f0d2c5"/><text x="24" y="39" fill="#143d35" font-family="Arial, sans-serif" font-size="17" font-weight="700">R3 · ALIGNED EVENTS</text><rect x="24" y="61" width="202" height="32" rx="8" fill="#143d35"/><text x="36" y="83" fill="#fffdf7" font-family="Arial, sans-serif" font-size="12">right lower opacity</text><path d="M42 131H210" stroke="#65706a" stroke-width="2"/><circle cx="78" cy="131" r="9" fill="#83b9dc"/><circle cx="138" cy="131" r="13" fill="#d7f06f"/><rect x="169" y="116" width="42" height="30" rx="8" fill="#f27c4d"/><text x="24" y="210" fill="#17201d" font-family="Arial, sans-serif" font-size="15" font-weight="700">Adds context</text><text x="24" y="235" fill="#65706a" font-family="Arial, sans-serif" font-size="14">language · action · task state</text><text x="24" y="268" fill="#9a4726" font-family="Arial, sans-serif" font-size="14">Alignment/lag assumptions enter</text></g>
  <text x="54" y="500" fill="#17201d" font-family="Arial, sans-serif" font-size="15" font-weight="700">Experimental rule</text><text x="190" y="500" fill="#65706a" font-family="Arial, sans-serif" font-size="15">Compare adjacent representations under the same split and backbone; shuffle the information you claim matters.</text>
</svg>
