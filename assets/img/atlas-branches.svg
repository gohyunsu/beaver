<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">BEAVER Research Atlas의 독립된 두 가지</title>
  <desc id="desc">왼쪽은 세 개의 gaze 핵심 연구, 오른쪽은 별도 gate로 관리하는 VLA-Guard Opportunity Lab이다.</desc>
