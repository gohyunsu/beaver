<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">VLA policy, semantic monitor, hard safety shield의 분리</title>
  <desc id="desc">명령과 관측이 VLA policy로 들어가며, 행동 제안은 semantic monitor와 deterministic safety shield를 거쳐 실행 또는 확인·중단된다.</desc>
  <rect width="1200" height="620" rx="28" fill="#fffdf7"/>
  <text x="52" y="58" fill="#17201d" font-family="Arial, sans-serif" font-size="29" font-weight="700">Capability is not assurance</text><text x="52" y="88" fill="#65706a" font-family="Arial, sans-serif" font-size="16">A hackathon-scale system should separate learned semantics from enforceable physical constraints.</text>
  <rect x="52" y="132" width="250" height="118" rx="20" fill="#eef4ef" stroke="#c9d9d2"/><text x="78" y="169" fill="#143d35" font-family="Arial, sans-serif" font-size="16" font-weight="700">INPUT CONTEXT</text><text x="78" y="199" fill="#17201d" font-family="Arial, sans-serif" font-size="15">language instruction</text><text x="78" y="224" fill="#17201d" font-family="Arial, sans-serif" font-size="15">RGB + robot state</text>
  <path d="M302 191H391" stroke="#65706a" stroke-width="3"/><path d="M391 191l-14-9v18z" fill="#65706a"/>
  <rect x="391" y="120" width="310" height="142" rx="22" fill="#143d35"/><text x="421" y="162" fill="#d7f06f" font-family="Arial, sans-serif" font-size="16" font-weight="700">VLA / TASK POLICY</text><text x="421" y="197" fill="#fffdf7" font-family="Arial, sans-serif" font-size="22" font-weight="700">proposes the next action</text><text x="421" y="229" fill="#b9cbc5" font-family="Arial, sans-serif" font-size="14">competence · grounding · task progress</text>
  <path d="M701 191H790" stroke="#65706a" stroke-width="3"/><path d="M790 191l-14-9v18z" fill="#65706a"/>
  <rect x="790" y="132" width="358" height="118" rx="20" fill="#f4f0e7" stroke="#d8d0c1"/><text x="816" y="169" fill="#143d35" font-family="Arial, sans-serif" font-size="16" font-weight="700">ACTION PROPOSAL</text><text x="816" y="199" fill="#17201d" font-family="Arial, sans-serif" font-size="15">target · pose · gripper · chunk</text><text x="816" y="224" fill="#65706a" font-family="Arial, sans-serif" font-size="14">not executed without checks</text>
  <path d="M969 250V306M969 306H334M969 306H857M334 306V342M857 306V342" stroke="#65706a" stroke-width="3" fill="none"/>
  <rect x="150" y="342" width="368" height="142" rx="22" fill="#fff7f1" stroke="#f27c4d" stroke-width="2"/><text x="178" y="382" fill="#9a4726" font-family="Arial, sans-serif" font-size="16" font-weight="700">LEARNED SEMANTIC MONITOR</text><text x="178" y="415" fill="#17201d" font-family="Arial, sans-serif" font-size="17" font-weight="700">wrong object · wrong goal · stall</text><text x="178" y="446" fill="#65706a" font-family="Arial, sans-serif" font-size="14">probabilistic → alert / ask / pause</text>
  <rect x="674" y="342" width="368" height="142" rx="22" fill="#eef4ef" stroke="#143d35" stroke-width="2"/><text x="702" y="382" fill="#143d35" font-family="Arial, sans-serif" font-size="16" font-weight="700">DETERMINISTIC HARD SHIELD</text><text x="702" y="415" fill="#17201d" font-family="Arial, sans-serif" font-size="17" font-weight="700">workspace · velocity · collision · E-stop</text><text x="702" y="446" fill="#65706a" font-family="Arial, sans-serif" font-size="14">enforceable → allow / block / stop</text>
  <path d="M334 484V532H553M858 484V532H647" stroke="#65706a" stroke-width="3" fill="none"/>
  <rect x="442" y="510" width="318" height="72" rx="18" fill="#17201d"/><text x="477" y="541" fill="#d7f06f" font-family="Arial, sans-serif" font-size="15" font-weight="700">RUNTIME DECISION + EVIDENCE</text><text x="477" y="565" fill="#fffdf7" font-family="Arial, sans-serif" font-size="14">allow · ask · pause · stop · recover</text>
  <text x="52" y="603" fill="#65706a" font-family="Arial, sans-serif" font-size="13">Source-informed synthesis: OpenVLA (policy), Sentinel (consistency/progress monitoring), SafeVLA/PACS/ForesightSafety-VLA (safety evaluation and constraints).</text>
</svg>
